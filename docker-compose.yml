# Local development database only. Not a production deployment definition.
services:
  db:
    image: postgres:17-alpine
    container_name: onekinra-db
    environment:
      POSTGRES_USER: onekinra
      POSTGRES_PASSWORD: onekinra_local_dev_only
      POSTGRES_DB: onekinra
    ports:
      - "5434:5432"
    volumes:
      - onekinra-db:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onekinra"]
      interval: 5s
      retries: 10
volumes:
  onekinra-db:
